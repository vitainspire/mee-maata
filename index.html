<!doctype html>
<html lang="te">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mee Maata · మీ మాట</title>
  <meta name="description"
    content="మీ తరగతి గది అనుభవాలు మాట్లాడి లేదా టైప్ చేసి చెప్పండి. సుమారు 15 నిమిషాలు, పేరు అవసరం లేదు.">
  <meta property="og:title" content="మీ మాట · Mee Maata — ఉపాధ్యాయుల గొంతు">
  <meta property="og:description"
    content="ఉపాధ్యాయుల కోసం ఉచిత సాధనాలు తయారు చేసే ముందు, మీ మాట వినాలనుకుంటున్నాం. సుమారు 15 నిమిషాలు, మాట్లాడి లేదా టైప్ చేసి.">
  <!-- For a picture in the WhatsApp preview, host og.png next to this file and replace with its FULL https address -->
  <meta property="og:image" content="og.png">
  <meta name="theme-color" content="#1E5A44">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Layout: one calm column, chalkboard-green header band, a big marigold mic button that turns speech into editable text. */
    :root {
      --bg: #F1F5F1;
      --surface: #FFFFFF;
      --ink: #15241C;
      --muted: #56665C;
      --line: #D5DED7;
      --board: #1E5A44;
      --board-ink: #F2F8F4;
      --board-muted: #B9D3C6;
      --marigold: #E9A21B;
      --marigold-ink: #271A00;
      --marigold-soft: #FBEFD3;
      --rec: #D4452A;
      --ok: #2E7D4F;
      --font: "Anek Telugu", "Noto Sans Telugu", "Nirmala UI", "Gautami", "Vani", system-ui, sans-serif;
      --r: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0E1813;
        --surface: #15221B;
        --ink: #E7F0EA;
        --muted: #A1B2A7;
        --line: #2A3B31;
        --board: #173F31;
        --board-ink: #EAF4EE;
        --board-muted: #98BBA9;
        --marigold: #F1B23C;
        --marigold-ink: #241800;
        --marigold-soft: #3A2E14;
        --rec: #F0694B;
        --ok: #62BE8A;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0E1813;
      --surface: #15221B;
      --ink: #E7F0EA;
      --muted: #A1B2A7;
      --line: #2A3B31;
      --board: #173F31;
      --board-ink: #EAF4EE;
      --board-muted: #98BBA9;
      --marigold: #F1B23C;
      --marigold-ink: #241800;
      --marigold-soft: #3A2E14;
      --rec: #F0694B;
      --ok: #62BE8A;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 18px;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px))
    }

    header {
      background: var(--board);
      color: var(--board-ink);
      padding-top: env(safe-area-inset-top, 0px)
    }

    header .wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-block: 12px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 20px
    }

    .brand small {
      display: block;
      font-weight: 500;
      font-size: 12px;
      color: var(--board-muted);
      letter-spacing: .6px;
      text-transform: uppercase;
      line-height: 1.1
    }

    .brand svg {
      flex: none
    }

    .spacer {
      flex: 1
    }

    .lang,
    .seg {
      display: flex;
      border: 1px solid var(--board-muted);
      border-radius: 999px;
      overflow: hidden;
      flex: none
    }

    .lang button {
      background: transparent;
      border: 0;
      color: var(--board-ink);
      padding: 6px 12px;
      font-size: 15px;
      cursor: pointer;
      min-height: 36px
    }

    .lang button[aria-pressed="true"] {
      background: var(--board-ink);
      color: var(--board)
    }

    .seg {
      border-color: var(--line)
    }

    .seg button {
      background: transparent;
      border: 0;
      color: var(--ink);
      padding: 4px 12px;
      font-size: 15px;
      cursor: pointer;
      min-height: 36px
    }

    .seg button[aria-pressed="true"] {
      background: var(--board);
      color: var(--board-ink)
    }

    .status {
      font-size: 14px;
      padding: 0 0 10px;
      color: var(--board-muted);
      display: flex;
      align-items: center;
      gap: 8px
    }

    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--board-muted);
      flex: none
    }

    .status.ok .dot {
      background: #7FD3A2
    }

    .status.wait .dot {
      background: var(--marigold)
    }

    .demo {
      background: var(--marigold-soft);
      color: var(--ink);
      font-size: 14px;
      text-align: center;
      padding: 6px 16px
    }

    main {
      padding-block: 20px 48px
    }

    h1 {
      font-size: 28px;
      line-height: 1.3;
      margin: 4px 0 12px;
      text-wrap: balance
    }

    h2 {
      font-size: 23px;
      line-height: 1.35;
      margin: 0 0 6px;
      text-wrap: balance
    }

    p {
      margin: 0 0 12px
    }

    .muted {
      color: var(--muted)
    }

    .small {
      font-size: 15px
    }

    .promises {
      list-style: none;
      padding: 0;
      margin: 16px 0;
      display: grid;
      gap: 10px
    }

    .promises li {
      display: flex;
      gap: 10px;
      align-items: flex-start
    }

    .promises svg {
      flex: none;
      margin-top: 5px;
      color: var(--ok)
    }

    .chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 14px
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 15px;
      background: var(--surface)
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 16px
    }

    details.card {
      padding: 0;
      margin: 0 0 14px
    }

    details.card summary {
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      min-height: 44px
    }

    details.card ul {
      margin: 0;
      padding: 0 16px 14px 34px;
      font-size: 15px;
      display: grid;
      gap: 6px
    }

    .consent {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      cursor: pointer
    }

    .consent input {
      width: 24px;
      height: 24px;
      margin-top: 3px;
      accent-color: var(--board);
      flex: none
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 12px;
      border: 0;
      padding: 14px 20px;
      min-height: 52px;
      font-weight: 600;
      cursor: pointer;
      font-size: 18px;
      text-decoration: none;
      text-align: center
    }

    .btn-primary {
      background: var(--board);
      color: var(--board-ink)
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .btn-gold {
      background: var(--marigold);
      color: var(--marigold-ink)
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line)
    }

    .btn-block {
      width: 100%
    }

    .stack {
      display: grid;
      gap: 12px
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      margin-top: 18px
    }

    .link {
      background: none;
      border: 0;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 10px 4px;
      cursor: pointer;
      font-size: 16px;
      min-height: 44px
    }

    :focus-visible {
      outline: 3px solid var(--marigold);
      outline-offset: 2px
    }

    .progress {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 14px
    }

    .bar {
      flex: 1;
      height: 6px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--marigold);
      border-radius: 99px;
      transition: width .4s
    }

    .badge {
      background: var(--marigold-soft);
      color: var(--ink);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 14px;
      font-weight: 600
    }

    .qtext {
      font-size: 23px;
      line-height: 1.5;
      font-weight: 600;
      margin: 0 0 8px;
      text-wrap: pretty
    }

    .hint {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 8px
    }

    .listen {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 15px;
      cursor: pointer;
      color: var(--ink);
      min-height: 40px
    }

    .microw {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 18px 0 10px;
      flex-wrap: wrap
    }

    .micbtn {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 0;
      background: var(--marigold);
      color: var(--marigold-ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 0 0 8px var(--marigold-soft);
      transition: transform .15s, background .2s;
      flex: none
    }

    .micbtn:active {
      transform: scale(.96)
    }

    .micbtn.on {
      background: var(--rec);
      color: #fff;
      box-shadow: 0 0 0 8px color-mix(in srgb, var(--rec) 22%, transparent);
      animation: pulse 1.6s ease-in-out infinite
    }

    .micbtn.busy {
      opacity: .6;
      cursor: progress
    }

    @keyframes pulse {
      50% {
        box-shadow: 0 0 0 14px color-mix(in srgb, var(--rec) 10%, transparent)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .micbtn.on {
        animation: none
      }

      .bar i {
        transition: none
      }
    }

    .micside {
      display: grid;
      gap: 6px;
      min-width: 0;
      flex: 1
    }

    .miclabel {
      font-weight: 600;
      line-height: 1.35
    }

    .timer {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 15px
    }

    .meter {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 22px
    }

    .meter span {
      width: 4px;
      border-radius: 2px;
      background: var(--rec);
      height: 3px;
      transition: height .08s
    }

    textarea {
      width: 100%;
      min-height: 170px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: var(--surface);
      resize: vertical;
      font-size: 18px;
      line-height: 1.55
    }

    textarea.live {
      border-color: var(--rec)
    }

    .interim {
      color: var(--muted);
      font-style: italic;
      min-height: 1.6em;
      font-size: 16px;
      margin-top: 6px
    }

    .tip {
      background: var(--marigold-soft);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 16px;
      margin: 14px 0 0
    }

    .chipgroup {
      margin: 0 0 18px
    }

    .chipgroup h3 {
      font-size: 17px;
      margin: 0 0 8px;
      font-weight: 600
    }

    .opts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .opt {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 8px 16px;
      min-height: 44px;
      cursor: pointer;
      font-size: 17px
    }

    .opt[aria-pressed="true"] {
      background: var(--board);
      border-color: var(--board);
      color: var(--board-ink)
    }

    input[type=text],
    input[type=tel] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: var(--surface);
      min-height: 48px
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: var(--bg);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      opacity: 0;
      transition: .3s;
      max-width: calc(100% - 32px);
      text-align: center;
      pointer-events: none;
      z-index: 20
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    .note {
      border-left: 4px solid var(--marigold);
      padding: 4px 0 4px 12px;
      margin: 14px 0
    }

    .alert {
      background: var(--marigold-soft);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 12px;
      font-size: 16px
    }

    .code {
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      font-weight: 700;
      font-size: 22px;
      user-select: all
    }

    .celebrate {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--marigold-soft);
      color: var(--marigold);
      margin: 4px 0 12px
    }

    .foot {
      margin-top: 28px;
      font-size: 14px;
      color: var(--muted);
      text-align: center
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0)
    }

    @media (max-width:440px) {
      .brand small {
        display: none
      }

      .lang button {
        padding: 6px 10px;
        font-size: 14px
      }

      .brand {
        font-size: 19px
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
          <rect x="2" y="4" width="30" height="21" rx="6" fill="currentColor" opacity=".16" />
          <path d="M9 25l-1 7 7-7" fill="currentColor" opacity=".16" />
          <rect x="14" y="9" width="6" height="10" rx="3" fill="#E9A21B" />
          <path d="M11 16a6 6 0 0 0 12 0" stroke="#E9A21B" stroke-width="2" fill="none" stroke-linecap="round" />
        </svg>
        <div>మీ మాట<small>Mee Maata · Teacher voices</small></div>
      </div>
      <div class="spacer"></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="te" aria-pressed="true">తెలుగు</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
    <div class="wrap">
      <div id="status" class="status ok" aria-live="polite"><span class="dot"></span><span id="statusText"></span></div>
    </div>
  </header>
  <div id="demo" class="demo" hidden></div>
  <main class="wrap" id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    /* ================= SETTINGS (edit these before sharing) ================= */
    const CONFIG = {
      ENDPOINT: "https://script.google.com/macros/s/AKfycbxP0iTjRjE7ROrEA7vkEaRDtiE3Ih9nh_YnFmT_obE2nNCEk32HYhJqBUV_LIz54JDnPQ/exec",              // Your Google Apps Script web-app URL. Empty = demo mode (nothing is sent).
      KEY: "Edu_Vita_2026",    // Must match SHARED_KEY in Code.gs
      CONTACT: "teacher@vitainspire.com",               // REQUIRED before sharing: WhatsApp number or email for questions and deletion requests
      RETENTION_MONTHS: 12,      // How long answers are kept after the study ends (shown to teachers)
      SERVER_STT: false,         // true = use Bhashini (via your Apps Script) when the phone's own speech-to-text is unavailable.
      //        Only set true after adding your Bhashini keys in Apps Script (see SETUP.md).
      AUDIO_BASE: "https://drive.google.com/drive/folders/18EuAcUjW2u0YC5LtRLaYZFNSA2nXXd_k",            // Optional: folder URL with recorded QUESTION audio named q01-te.mp3, q01-en.mp3 …
      SERVER_CHUNK_SECONDS: 28   // Bhashini works best with short clips; teachers tap again to keep talking
    };
    /* Teachers' voices are never recorded or stored. Speech is turned into text, the teacher checks/edits it,
       and only the saved text is sent. */

    /* ================= QUESTIONS: 8 main + 4 optional ================= */
    const QUESTIONS = [
      {
        id: "q01", tag: "last_class", core: true,
        te: "మీరు ఇటీవల చెప్పిన గణితం లేదా సైన్స్ తరగతి గురించి చెప్పండి. ఏమి జరిగింది? ఏది బాగా జరిగింది, ఏది కష్టంగా అనిపించింది?",
        en: "Tell us about the last maths or science class you taught. What happened? What went well, and what was hard?",
        hte: "స్నేహితుడికి చెప్పినట్లు చెప్పండి.", hen: "Describe it the way you would tell a friend."
      },
      {
        id: "q02", tag: "mixed_levels", core: true,
        te: "ఒకే తరగతిలో పిల్లలు వేర్వేరు స్థాయిల్లో ఉంటారు. బాగా వెనుకబడిన ఒక పిల్లవాడిని, ముందున్న ఒక పిల్లవాడిని గుర్తు చేసుకోండి. ఒకే పీరియడ్‌లో ఇద్దరినీ ఎలా చూసుకుంటారు?",
        en: "Children in one class are often at very different levels. Think of one child who is far behind and one who is ahead. How do you manage both in the same period?",
        hte: "పేర్లు చెప్పవద్దు. వెనుకబడిన పిల్లల కోసం ప్రత్యేక సమయం ఏదైనా ఉందా?", hen: "Please don't say names. Is there any special time for children who are behind?"
      },
      {
        id: "q03", tag: "hardest_topic", core: true,
        te: "6–8 తరగతుల్లో పిల్లలకు ఏ పాఠం అత్యంత కష్టంగా ఉంటుంది? వాళ్ళు ఇరుక్కుపోయారని మీకు ఎలా తెలుస్తుంది? మీరు ఏమేమి ప్రయత్నించారు?",
        en: "Which topic in classes 6–8 do students find hardest? How can you tell they are stuck? What have you tried?",
        hte: "", hen: ""
      },
      {
        id: "q04", tag: "curiosity", core: true,
        te: "ఒక విద్యార్థి మీరు ఊహించని ప్రశ్న చివరిసారిగా ఎప్పుడు అడిగారు? ఆ ప్రశ్న ఏమిటి? ఇలా ఎంత తరచుగా జరుగుతుంది?",
        en: "When did a student last ask you a question you did not expect? What was it? How often does this happen?",
        hte: "", hen: ""
      },
