<!doctype html>
<html lang="te">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mee Maata · మీ మాట</title>
  <meta name="description"
    content="మీ తరగతి గది అనుభవాలు మీ గొంతులో చెప్పండి. సుమారు 15 నిమిషాలు, వాయిస్‌తో, పేరు అవసరం లేదు.">
  <meta property="og:title" content="మీ మాట · Mee Maata — ఉపాధ్యాయుల గొంతు">
  <meta property="og:description"
    content="ఉపాధ్యాయుల కోసం ఉచిత సాధనాలు తయారు చేసే ముందు, మీ మాట వినాలనుకుంటున్నాం. సుమారు 15 నిమిషాలు, వాయిస్‌తో.">
  <!-- For a picture in the WhatsApp preview, host og.png next to this file and replace with its FULL https address -->
  <meta property="og:image" content="og.png">
  <meta name="theme-color" content="#1E5A44">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Layout: one calm column, chalkboard-green header band, a single big marigold record button as the hero of every question. */
    :root {
      --bg: #F1F5F1;
      --surface: #FFFFFF;
      --ink: #15241C;
      --muted: #56665C;
      --line: #D5DED7;
      --board: #1E5A44;
      --board-ink: #F2F8F4;
      --board-muted: #B9D3C6;
      --marigold: #E9A21B;
      --marigold-ink: #271A00;
      --marigold-soft: #FBEFD3;
      --rec: #D4452A;
      --ok: #2E7D4F;
      --font: "Anek Telugu", "Noto Sans Telugu", "Nirmala UI", "Gautami", "Vani", system-ui, sans-serif;
      --r: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0E1813;
        --surface: #15221B;
        --ink: #E7F0EA;
        --muted: #A1B2A7;
        --line: #2A3B31;
        --board: #173F31;
        --board-ink: #EAF4EE;
        --board-muted: #98BBA9;
        --marigold: #F1B23C;
        --marigold-ink: #241800;
        --marigold-soft: #3A2E14;
        --rec: #F0694B;
        --ok: #62BE8A;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0E1813;
      --surface: #15221B;
      --ink: #E7F0EA;
      --muted: #A1B2A7;
      --line: #2A3B31;
      --board: #173F31;
      --board-ink: #EAF4EE;
      --board-muted: #98BBA9;
      --marigold: #F1B23C;
      --marigold-ink: #241800;
      --marigold-soft: #3A2E14;
      --rec: #F0694B;
      --ok: #62BE8A;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 18px;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px))
    }

    header {
      background: var(--board);
      color: var(--board-ink);
      padding-top: env(safe-area-inset-top, 0px)
    }

    header .wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-block: 12px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 20px
    }

    .brand small {
      display: block;
      font-weight: 500;
      font-size: 12px;
      color: var(--board-muted);
      letter-spacing: .6px;
      text-transform: uppercase;
      line-height: 1.1
    }

    .brand svg {
      flex: none
    }

    .spacer {
      flex: 1
    }

    .lang {
      display: flex;
      border: 1px solid var(--board-muted);
      border-radius: 999px;
      overflow: hidden;
      flex: none
    }

    .lang button {
      background: transparent;
      border: 0;
      color: var(--board-ink);
      padding: 6px 12px;
      font-size: 15px;
      cursor: pointer;
      min-height: 36px
    }

    .lang button[aria-pressed="true"] {
      background: var(--board-ink);
      color: var(--board)
    }

    .status {
      font-size: 14px;
      padding: 0 0 10px;
      color: var(--board-muted);
      display: flex;
      align-items: center;
      gap: 8px
    }

    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--board-muted);
      flex: none
    }

    .status.ok .dot {
      background: #7FD3A2
    }

    .status.wait .dot {
      background: var(--marigold)
    }

    .demo {
      background: var(--marigold-soft);
      color: var(--ink);
      font-size: 14px;
      text-align: center;
      padding: 6px 16px
    }

    main {
      padding-block: 20px 48px
    }

    h1 {
      font-size: 28px;
      line-height: 1.3;
      margin: 4px 0 12px;
      text-wrap: balance
    }

    h2 {
      font-size: 23px;
      line-height: 1.35;
      margin: 0 0 6px;
      text-wrap: balance
    }

    p {
      margin: 0 0 12px
    }

    .muted {
      color: var(--muted)
    }

    .small {
      font-size: 15px
    }

    .promises {
      list-style: none;
      padding: 0;
      margin: 16px 0;
      display: grid;
      gap: 10px
    }

    .promises li {
      display: flex;
      gap: 10px;
      align-items: flex-start
    }

    .promises svg {
      flex: none;
      margin-top: 5px;
      color: var(--ok)
    }

    .chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 14px
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 15px;
      background: var(--surface)
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 16px
    }

    details.card {
      padding: 0;
      margin: 0 0 14px
    }

    details.card summary {
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      min-height: 44px
    }

    details.card ul {
      margin: 0;
      padding: 0 16px 14px 34px;
      font-size: 15px;
      display: grid;
      gap: 6px
    }

    .consent {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      cursor: pointer
    }

    .consent input {
      width: 24px;
      height: 24px;
      margin-top: 3px;
      accent-color: var(--board);
      flex: none
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 12px;
      border: 0;
      padding: 14px 20px;
      min-height: 52px;
      font-weight: 600;
      cursor: pointer;
      font-size: 18px;
      text-decoration: none;
      text-align: center
    }

    .btn-primary {
      background: var(--board);
      color: var(--board-ink)
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .btn-gold {
      background: var(--marigold);
      color: var(--marigold-ink)
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line)
    }

    .btn-block {
      width: 100%
    }

    .stack {
      display: grid;
      gap: 12px
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      margin-top: 18px
    }

    .link {
      background: none;
      border: 0;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 10px 4px;
      cursor: pointer;
      font-size: 16px;
      min-height: 44px
    }

    :focus-visible {
      outline: 3px solid var(--marigold);
      outline-offset: 2px
    }

    .progress {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 14px
    }

    .bar {
      flex: 1;
      height: 6px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--marigold);
      border-radius: 99px;
      transition: width .4s
    }

    .badge {
      background: var(--marigold-soft);
      color: var(--ink);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 14px;
      font-weight: 600
    }

    .qtext {
      font-size: 23px;
      line-height: 1.5;
      font-weight: 600;
      margin: 0 0 8px;
      text-wrap: pretty
    }

    .hint {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 8px
    }

    .listen {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 15px;
      cursor: pointer;
      color: var(--ink);
      min-height: 40px
    }

    .reczone {
      display: grid;
      justify-items: center;
      gap: 10px;
      margin: 22px 0 6px;
      text-align: center
    }

    .recbtn {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      border: 0;
      background: var(--marigold);
      color: var(--marigold-ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 0 0 10px var(--marigold-soft);
      transition: transform .15s, background .2s
    }

    .recbtn:active {
      transform: scale(.96)
    }

    .recbtn.on {
      background: var(--rec);
      color: #fff;
      box-shadow: 0 0 0 10px color-mix(in srgb, var(--rec) 22%, transparent);
      animation: pulse 1.6s ease-in-out infinite
    }

    @keyframes pulse {
      50% {
        box-shadow: 0 0 0 18px color-mix(in srgb, var(--rec) 10%, transparent)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .recbtn.on {
        animation: none
      }

      .bar i {
        transition: none
      }
    }

    .reclabel {
      font-weight: 600
    }

    .timer {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 16px
    }

    .meter {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 36px
    }

    .meter span {
      width: 5px;
      border-radius: 3px;
      background: var(--rec);
      height: 4px;
      transition: height .08s
    }

    audio {
      width: 100%;
      margin: 6px 0
    }

    textarea {
      width: 100%;
      min-height: 160px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: var(--surface);
      resize: vertical;
      font-size: 18px
    }

    .tip {
      background: var(--marigold-soft);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 16px;
      margin: 14px 0 0
    }

    .chipgroup {
      margin: 0 0 18px
    }

    .chipgroup h3 {
      font-size: 17px;
      margin: 0 0 8px;
      font-weight: 600
    }

    .opts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .opt {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 8px 16px;
      min-height: 44px;
      cursor: pointer;
      font-size: 17px
    }

    .opt[aria-pressed="true"] {
      background: var(--board);
      border-color: var(--board);
      color: var(--board-ink)
    }

    input[type=text],
    input[type=tel] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: var(--surface);
      min-height: 48px
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: var(--bg);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      opacity: 0;
      transition: .3s;
      max-width: calc(100% - 32px);
      text-align: center;
      pointer-events: none;
      z-index: 20
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    .note {
      border-left: 4px solid var(--marigold);
      padding: 4px 0 4px 12px;
      margin: 14px 0
    }

    .alert {
      background: var(--marigold-soft);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 12px;
      font-size: 16px
    }

    .code {
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      font-weight: 700;
      font-size: 22px;
      user-select: all
    }

    .celebrate {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--marigold-soft);
      color: var(--marigold);
      margin: 4px 0 12px
    }

    .foot {
      margin-top: 28px;
      font-size: 14px;
      color: var(--muted);
      text-align: center
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0)
    }

    @media (max-width:440px) {
      .brand small {
        display: none
      }

      .lang button {
        padding: 6px 10px;
        font-size: 14px
      }

      .brand {
        font-size: 19px
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
          <rect x="2" y="4" width="30" height="21" rx="6" fill="currentColor" opacity=".16" />
          <path d="M9 25l-1 7 7-7" fill="currentColor" opacity=".16" />
          <rect x="14" y="9" width="6" height="10" rx="3" fill="#E9A21B" />
          <path d="M11 16a6 6 0 0 0 12 0" stroke="#E9A21B" stroke-width="2" fill="none" stroke-linecap="round" />
        </svg>
        <div>మీ మాట<small>Mee Maata · Teacher voices</small></div>
      </div>
      <div class="spacer"></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="te" aria-pressed="true">తెలుగు</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
    <div class="wrap">
      <div id="status" class="status ok" aria-live="polite"><span class="dot"></span><span id="statusText"></span></div>
    </div>
  </header>
  <div id="demo" class="demo" hidden></div>
  <main class="wrap" id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="filepick" type="file" accept="audio/*" capture class="sr" tabindex="-1" aria-hidden="true">

  <script>
    /* ================= SETTINGS (edit these before sharing) ================= */
    const CONFIG = {
      ENDPOINT: "https://script.google.com/macros/s/AKfycbxLtinB1u96xLLm2fCskVVnnFp_8uZePBdJA53SvUYn1XV40mMd_GSsNhKuuDg95WpoIA/exec",              // Your Google Apps Script web-app URL. Empty = demo mode (nothing is sent).
      KEY: "Vita_Educate_2026",    // Must match SHARED_KEY in Code.gs
      CONTACT: "ramana@vitainspire.com",               // REQUIRED before sharing: WhatsApp number or email teachers can use to ask questions or delete answers
      RETENTION_MONTHS: 1,      // How long recordings are kept after the study ends (shown to teachers)
      AUDIO_BASE: "https://drive.google.com/drive/folders/18EuAcUjW2u0YC5LtRLaYZFNSA2nXXd_k",            // Optional: folder URL with recorded question audio named q01-te.mp3, q01-en.mp3 …
      MAX_SECONDS: 240           // Longest single voice answer (4 minutes)
    };

    /* ================= QUESTIONS: 8 main + 4 optional ================= */
    const QUESTIONS = [
      {
        id: "q01", tag: "last_class", core: true,
        te: "మీరు ఇటీవల చెప్పిన గణితం లేదా సైన్స్ తరగతి గురించి చెప్పండి. ఏమి జరిగింది? ఏది బాగా జరిగింది, ఏది కష్టంగా అనిపించింది?",
        en: "Tell us about the last maths or science class you taught. What happened? What went well, and what was hard?",
        hte: "స్నేహితుడికి చెప్పినట్లు చెప్పండి.", hen: "Describe it the way you would tell a friend."
      },
      {
        id: "q02", tag: "mixed_levels", core: true,
        te: "ఒకే తరగతిలో పిల్లలు వేర్వేరు స్థాయిల్లో ఉంటారు. బాగా వెనుకబడిన ఒక పిల్లవాడిని, ముందున్న ఒక పిల్లవాడిని గుర్తు చేసుకోండి. ఒకే పీరియడ్‌లో ఇద్దరినీ ఎలా చూసుకుంటారు?",
        en: "Children in one class are often at very different levels. Think of one child who is far behind and one who is ahead. How do you manage both in the same period?",
        hte: "పేర్లు చెప్పవద్దు. వెనుకబడిన పిల్లల కోసం ప్రత్యేక సమయం ఏదైనా ఉందా?", hen: "Please don't say names. Is there any special time for children who are behind?"
      },
      {
        id: "q03", tag: "hardest_topic", core: true,
        te: "6–8 తరగతుల్లో పిల్లలకు ఏ పాఠం అత్యంత కష్టంగా ఉంటుంది? వాళ్ళు ఇరుక్కుపోయారని మీకు ఎలా తెలుస్తుంది? మీరు ఏమేమి ప్రయత్నించారు?",
        en: "Which topic in classes 6–8 do students find hardest? How can you tell they are stuck? What have you tried?",
        hte: "", hen: ""
      },
      {
        id: "q04", tag: "curiosity", core: true,
        te: "ఒక విద్యార్థి మీరు ఊహించని ప్రశ్న చివరిసారిగా ఎప్పుడు అడిగారు? ఆ ప్రశ్న ఏమిటి? ఇలా ఎంత తరచుగా జరుగుతుంది?",
        en: "When did a student last ask you a question you did not expect? What was it? How often does this happen?",
        hte: "", hen: ""
      },
      {
        id: "q05", tag: "real_world", core: true,
        te: "ఒక పాఠాన్ని రోజువారీ జీవితంతో — వ్యవసాయం, సంత, వంట, ఇల్లు — ముడిపెట్టిన సందర్భం గురించి చెప్పండి. పిల్లలు ఎలా స్పందించారు?",
        en: "Tell us about a time you linked a lesson to daily life — farming, the market, cooking, home. How did the students react?",
        hte: "అలా ఎప్పుడూ కుదరకపోతే, ఎందుకో చెప్పండి.", hen: "If it hasn't been possible, tell us why."
      },

    function renderWelcome() {
      const x = t();
      app.innerHTML = `
    <h1>${x.h1}</h1>
    <p>${x.intro}</p>
    <ul class="promises">${x.p.map(s => `<li>${ICON.check}<span>${s}</span></li>`).join('')}</ul>
    <div class="chips-row">${x.chips.map(c => `<span class="pill">${c}</span>`).join('')}</div>
    <details class="card"><summary>${x.privacyTitle}</summary><ul>${x.privacy(CONFIG.RETENTION_MONTHS).map(s => `<li>${s}</li>`).join('')}${CONFIG.CONTACT ? `<li>${x.contact} <span style="user-select:all">${esc(CONFIG.CONTACT)}</span></li>` : ''}</ul></details>
    <label class="card consent" for="consent"><input type="checkbox" id="consent" ${S.consent ? 'checked' : ''}><span>${x.consent}</span></label>
    <div class="stack" style="margin-top:16px">
      ${resumable ? `<button class="btn btn-gold btn-block" id="resume" ${S.consent ? '' : 'disabled'}>${x.resume}</button><button class="link" id="restart">${x.restart}</button>`
          : `<button class="btn btn-primary btn-block" id="start" ${S.consent ? '' : 'disabled'}>${x.start}</button>`}
    </div>
    ${CONFIG.CONTACT ? `<p class="foot">${x.contact} <span style="user-select:all">${esc(CONFIG.CONTACT)}</span></p>` : ''}
    <p class="foot">${x.foot}</p>`;
      $('#consent').addEventListener('change', e => { S.consent = e.target.checked; save(); const b = $('#start') || $('#resume'); if (b) b.disabled = !S.consent; });
      if ($('#start')) $('#start').addEventListener('click', () => { S.screen = 0; go('profile'); });
      if ($('#resume')) $('#resume').addEventListener('click', () => { const to = S._resumeFrom || 'profile'; delete S._resumeFrom; resumable = false; go(to); });
      if ($('#restart')) $('#restart').addEventListener('click', () => { const l = S.lang; S = fresh(); S.lang = l; resumable = false; save(); render(); });
    }
    function renderProfile() {
      const x = t(), L = S.lang, scr = PROFILE_SCREENS[S.screen || 0];
      app.innerHTML = `
    <div class="progress"><span>${(S.screen || 0) + 1} / ${PROFILE_SCREENS.length}</span><div class="bar"><i style="width:${Math.round(((S.screen || 0) + 1) / PROFILE_SCREENS.length * 100)}%"></i></div></div>
    <h2>${scr[L]}</h2><p class="muted small">${x.tapSub}</p>
    ${scr.groups.map(g => `<div class="chipgroup" role="group" aria-label="${esc(g[L])}"><h3>${g[L]}</h3><div class="opts">${g.opts.map(o => { const v = S.profile[g.id]; const on = g.multi ? (Array.isArray(v) && v.includes(o[0])) : v === o[0]; return `<button type="button" class="opt" data-g="${g.id}" data-v="${o[0]}" aria-pressed="${on}">${L === 'te' ? o[1] : o[2]}</button>`; }).join('')}</div></div>`).join('')}
    ${scr.district ? `<div class="chipgroup"><h3><label for="district">${x.district}</label></h3><input type="text" id="district" maxlength="60" autocomplete="off" value="${esc(S.profile.district || '')}"></div>` : ''}
    <button class="btn btn-primary btn-block" id="pnext">${x.cont}</button>
    <div class="links"><button class="link" id="pback">${x.back}</button></div>`;
      app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
        const g = scr.groups.find(p => p.id === b.dataset.g), v = b.dataset.v;
        if (g.multi) { const arr = Array.isArray(S.profile[g.id]) ? S.profile[g.id] : []; S.profile[g.id] = arr.includes(v) ? arr.filter(a => a !== v) : [...arr, v]; }
        else S.profile[g.id] = S.profile[g.id] === v ? undefined : v;
        save();
        b.parentNode.querySelectorAll('.opt').forEach(o => { const cur = S.profile[g.id]; o.setAttribute('aria-pressed', String(g.multi ? (Array.isArray(cur) && cur.includes(o.dataset.v)) : cur === o.dataset.v)); });
      }));
      const d = $('#district'); if (d) d.addEventListener('input', e => { S.profile.district = e.target.value.slice(0, 60); save(); });
      $('#pnext').addEventListener('click', () => {
        if ((S.screen || 0) < PROFILE_SCREENS.length - 1) { S.screen = (S.screen || 0) + 1; go('profile'); return; }
        enqueue(Object.assign(baseMeta('profile'), { profile: S.profile }));
        resetRec(); rec.mode = 'voice'; S.idx = S.idx || 0; go('q');
      });
      $('#pback').addEventListener('click', () => { if ((S.screen || 0) > 0) { S.screen--; go('profile'); } else go('welcome'); });
    }
    function renderQ() {
      const x = t(), L = S.lang, q = QUESTIONS[S.idx];
      const isBonus = !q.core, pos = isBonus ? S.idx - CORE_N + 1 : S.idx + 1, tot = isBonus ? QUESTIONS.length - CORE_N : CORE_N;
      const lastOfPart = isBonus ? S.idx === QUESTIONS.length - 1 : S.idx === CORE_N - 1;
      const hint = L === 'te' ? q.hte : q.hen;
      const busy = rec.state === 'recording' || rec.state === 'stopping';
      let zone = '';
      if (rec.mode === 'text') {
        zone = `<textarea id="ta" placeholder="${x.typePh}" aria-label="${x.typePh}">${esc((S._draft && S._draft[q.id]) || '')}</textarea>
      <button class="btn btn-primary btn-block" id="saveText" style="margin-top:12px">${lastOfPart ? x.saveFinish : x.saveNext}</button>`;
      } else if (rec.state === 'review') {
        zone = `<div class="card"><div class="small muted">${x.listenBack}${rec.secs ? ` · ${fmt(rec.secs)}` : ''}</div><audio controls src="${rec.url}"></audio></div>
      <div class="stack" style="margin-top:12px"><button class="btn btn-gold btn-block" id="saveVoice">${lastOfPart ? x.saveFinish : x.saveNext}</button>
      <button class="btn btn-ghost btn-block" id="again">${x.again}</button></div>`;
      } else {
        zone = `<div class="reczone">
        <button class="recbtn ${busy ? 'on' : ''}" id="recbtn" aria-label="${busy ? x.recording : x.tap}">${busy ? ICON.stop : ICON.mic}</button>
        <div class="reclabel">${busy ? x.recording : x.tap}</div>
        ${busy ? `<div class="meter" id="meter" aria-hidden="true">${'<span></span>'.repeat(22)}</div><div class="timer" id="timer">${fmt(rec.secs)} / ${fmt(CONFIG.MAX_SECONDS)}</div>` : `<div class="small muted">${x.lenHint}</div>`}
      </div>
      ${rec.err ? `<div class="alert" role="alert">${rec.err}<div class="stack" style="margin-top:10px"><button class="btn btn-ghost btn-block" id="phoneRec">${x.phoneRec}</button></div></div>` : ''}`;
      }
      app.innerHTML = `
    <div class="progress">${isBonus ? `<span class="badge">${x.bonus}</span>` : ''}<span>${isBonus ? x.bonusOf(pos, tot) : x.qOf(pos, tot)}</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${tot}" aria-valuenow="${pos - 1}"><i style="width:${Math.round((pos - 1) / tot * 100)}%"></i></div></div>
    <p class="qtext" id="qtext">${q[L]}</p>
    ${hint ? `<div class="hint">${hint}</div>` : ''}
    ${canListen() && !busy ? `<button class="listen" id="listen">${ICON.speaker}<span>${x.listen}</span></button>` : ''}
    ${S.idx === 0 && rec.state === 'idle' && rec.mode === 'voice' ? `<div class="tip">${x.tip}</div>` : ''}
    ${zone}
    ${busy ? '' : `<div class="links">
      <button class="link" id="qback">${x.back}</button>
      <button class="link" id="mode">${rec.mode === 'text' ? x.speakInstead : x.typeInstead}</button>
      <button class="link" id="skip">${x.skip}</button>
    </div>`}`;
      const on = (id, fn) => { const el = $('#' + id); if (el) el.addEventListener('click', fn); };
      on('listen', () => speak(q));
      on('recbtn', () => { if (rec.state === 'recording') stopRec(); else if (rec.state === 'idle') startRec(); });
      on('again', () => { resetRec(); startRec(); });
      on('phoneRec', () => $('#filepick').click());
      on('saveVoice', () => saveAnswer('voice'));
      on('saveText', () => saveAnswer('text'));
      on('skip', () => saveAnswer('skipped'));
      on('mode', () => { rec.mode = rec.mode === 'text' ? 'voice' : 'text'; resetRec(); renderQ(); });
      on('qback', () => {
        stopSpeaking(); resetRec(); rec.mode = 'voice';
        if (S.idx === 0) { S.screen = PROFILE_SCREENS.length - 1; go('profile'); }
        else if (S.idx === CORE_N) { go('checkpoint'); }
        else { S.idx--; go('q'); }
      });
      const ta = $('#ta'); if (ta) { ta.addEventListener('input', e => { S._draft = S._draft || {}; S._draft[q.id] = e.target.value; save(); }); }
    }
    function answeredCount() { return Object.values(S.answers).filter(v => v !== 'skipped').length; }
    function saveAnswer(kind) {
      stopSpeaking();
      const q = QUESTIONS[S.idx], x = t();
      let text = '';
      if (kind === 'text') { const ta = $('#ta'); text = (ta && ta.value || '').trim(); if (!text) { ta && ta.focus(); return; } }
      if (kind === 'voice' && !rec.blob) return;
      const meta = Object.assign(baseMeta('answer'), { qid: q.id, qno: S.idx + 1, tag: q.tag, core: q.core, question: q.en, answerType: kind, text, durationSec: kind === 'voice' ? rec.secs : 0 });
      const replacing = S.answers[q.id] === 'voice';
      enqueue(meta, kind === 'voice' ? rec.blob : null);
      if (kind === 'voice' && !replacing) S.seconds += rec.secs || 0;
      S.answers[q.id] = kind;
      if (S._draft) delete S._draft[q.id];
      resetRec(); rec.mode = 'voice';
      if (S.idx === CORE_N - 1 && S.bonus === null) { go('checkpoint'); return; }
      if (S.idx >= QUESTIONS.length - 1 || (S.idx === CORE_N - 1 && S.bonus === false)) { finish(); return; }
      S.idx++; go('q');
      if (kind === 'skipped') toast(x.skipped);
      else if (S.idx === Math.floor(CORE_N / 2)) toast(x.half);
      else if (S.idx === CORE_N - 1 || S.idx === QUESTIONS.length - 1) toast(x.nearly);
      else toast(x.cheers[S.idx % x.cheers.length]);
    }
    function renderCheckpoint() {
      const x = t();
      app.innerHTML = `
    <div class="celebrate">${ICON.star}</div>
    <h2>${x.cpTitle}</h2>
    <p>${x.cpBody}</p>
    <div class="stack" style="margin-top:18px">
      <button class="btn btn-gold btn-block" id="cpYes">${x.cpYes}</button>
      <button class="btn btn-ghost btn-block" id="cpNo">${x.cpNo}</button>
    </div>
    <div class="links"><button class="link" id="cpBack">${x.back}</button></div>`;
      $('#cpYes').addEventListener('click', () => { S.bonus = true; S.idx = CORE_N; resetRec(); rec.mode = 'voice'; go('q'); });
      $('#cpNo').addEventListener('click', () => { S.bonus = false; finish(); });
      $('#cpBack').addEventListener('click', () => { S.idx = CORE_N - 1; go('q'); });
    }
    function finish() {
      enqueue(Object.assign(baseMeta('complete'), { answered: answeredCount(), voiceSeconds: S.seconds, bonus: !!S.bonus, profile: S.profile }));
      go('followup');
    }
    function renderFollowup() {
      const x = t();
      app.innerHTML = `
    <h2>${x.fuTitle}</h2>
    <p>${x.fuBody}</p>
    <label class="sr" for="phone">${x.fuPh}</label>
    <input type="tel" id="phone" inputmode="numeric" autocomplete="tel" placeholder="${x.fuPh}" maxlength="14">
    <label class="card consent" for="fuc" style="margin-top:12px"><input type="checkbox" id="fuc"><span>${x.fuConsent}</span></label>
    <div id="fuErr" class="alert" role="alert" hidden></div>
    <div class="stack" style="margin-top:16px">
      <button class="btn btn-primary btn-block" id="fuSend" disabled>${x.fuSend}</button>
      <button class="btn btn-ghost btn-block" id="fuSkip">${x.fuSkip}</button>
    </div>`;
      const upd = () => { $('#fuSend').disabled = !($('#fuc').checked && $('#phone').value.trim()); };
      $('#phone').addEventListener('input', upd); $('#fuc').addEventListener('change', upd);
      $('#fuSend').addEventListener('click', () => {
        const digits = $('#phone').value.replace(/\D/g, '').replace(/^(91|0)(?=\d{10}$)/, '');
        if (!/^[6-9]\d{9}$/.test(digits)) { const e = $('#fuErr'); e.textContent = x.fuBad; e.hidden = false; return; }
        // Sent WITHOUT the session id, so the number cannot be linked to the answers.
        enqueue({ type: 'followup', phone: digits, district: S.profile.district || '', ref: S.ref || '', lang: S.lang, clientTime: new Date().toISOString(), sessionId: 'contact' });
        S.followup = true; toast(x.fuThanks); doneNow();
      });
      $('#fuSkip').addEventListener('click', () => { S.followup = false; doneNow(); });
    }
    function doneNow() { S.completed = true; go('done'); }
    function shareUrl() { const u = new URL(location.href); u.hash = ''; u.searchParams.delete('lang'); return u.toString(); }
    function renderDone() {
      const x = t();
      const mins = Math.round(S.seconds / 60);
      const link = shareUrl();
      app.innerHTML = `
    <div class="celebrate">${ICON.star}</div>
    <h1>${x.doneTitle}</h1>
    <p>${x.doneBody}</p>
    <div class="note">${x.answered(answeredCount(), mins)}</div>
    <div class="card"><div class="small muted">${x.codeLabel}</div><div class="code">${code()}</div><div class="small muted">${x.codeHelp}${CONFIG.CONTACT ? ` · <span style="user-select:all">${esc(CONFIG.CONTACT)}</span>` : ''}</div></div>
    <div id="doneStatus" class="alert" aria-live="polite"></div>
    <div class="stack" style="margin-top:18px">
      <a class="btn btn-gold btn-block" id="wa" href="https://wa.me/?text=${encodeURIComponent(x.shareMsg + link)}" target="_blank" rel="noopener">${ICON.wa}<span>${x.share}</span></a>
      <button class="btn btn-ghost btn-block" id="copy">${x.copy}</button>
    </div>
    <p class="foot">${x.foot}</p>`;
      $('#copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(link); toast(x.copied); } catch (e) { toast(link); } });
      renderDoneStatus();
    }
    function renderDoneStatus() { const el = $('#doneStatus'); if (!el) return; el.textContent = pending > 0 ? t().keepOpen : t().allSent; }

    /* ================= START ================= */
    if (!CONFIG.CONTACT) console.warn('Mee Maata: set CONFIG.CONTACT before sharing — teachers need it to ask questions or delete answers.');
    setLang(S.lang);
    pump();
    addEventListener('beforeunload', e => { if (pending > 0 || rec.state === 'recording') { e.preventDefault(); e.returnValue = ''; } });
  </script>
</body>

</html>
